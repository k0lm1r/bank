services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_db
    ports:
      - 8080:5432
    volumes:
      - data-db:/var/lib/postgres/data
      - ./start.sql:/docker-entrypoint-initdb.d/start.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    image: backend:1.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
volumes:
  data-db:
